<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN & Mobilfunk Kamera Stream</title>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #ffffff; 
            padding: 20px 10px; 
            margin: 0; 
        }
        video { 
            width: 100%; 
            max-width: 640px; 
            min-height: 260px;
            aspect-ratio: 16 / 9;
            background: #000; 
            border: 2px solid #333;
            border-radius: 8px; 
            margin-top: 15px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            object-fit: contain;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 8px; 
            width: 85%; 
            max-width: 320px; 
            font-weight: 600; 
        }
        button:hover { background: #0056b3; }
        .play-btn {
            background: #10b981;
            font-size: 18px;
            animation: pulse 1.5s infinite;
        }
        .play-btn:hover { background: #059669; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        input[type="text"] {
            padding: 12px;
            width: 80%;
            max-width: 300px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }
        .error-box { 
            background: #4a1515; 
            border: 1px solid #ff4d4d; 
            color: #ffcccc; 
            padding: 12px; 
            margin: 15px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: left; 
            font-family: monospace; 
            font-size: 13px;
        }
        .info-box { 
            background: #172a45; 
            border: 1px solid #2563eb; 
            color: #dbeafe; 
            padding: 16px; 
            margin: 15px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: center; 
            word-break: break-all; 
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Kamera Live-Stream</h1>
    
    <div id="error-display" class="error-box hidden"></div>
    <h2 id="status">Bereit</h2>

    <div id="role-selection">
        <p>Wählen Sie den Modus für dieses Gerät:</p>
        <button onclick="startAsBroadcaster()">1. Als Kamera senden</button>
        <button onclick="startAsViewerMode()">2. Als Zuschauer empfangen</button>
    </div>

    <div id="viewer-input-zone" class="hidden">
        <div class="info-box">
            <p>Geben Sie die ID des Kamera-Geräts ein:</p>
            <input type="text" id="target-peer-id" placeholder="z. B. stream-123456"><br>
            <button onclick="connectToBroadcaster()">Verbindung herstellen</button>
        </div>
    </div>

    <div id="share-zone" class="info-box hidden">
        <strong>Deine Kamera-ID:</strong><br>
        <span id="my-id-display" style="font-size: 24px; color: #60a5fa; font-family: monospace; font-weight: bold;">...generiere...</span>
        <p style="font-size: 12px; margin-top: 8px; color: #93c5fd;">Lassen Sie dieses Fenster geöffnet und das Display an.</p>
    </div>

    <!-- Manueller Startbutton, falls Autoplay blockiert wird -->
    <button id="manual-play-btn" class="play-btn hidden" onclick="startManualPlayback()">▶ Video starten</button>

    <video id="video-element" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let localStream = null;
        let heartbeatTimer = null;
        let wakeLock = null;

        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const roleSelection = document.getElementById('role-selection');
        const errorDisplay = document.getElementById('error-display');
        const shareZone = document.getElementById('share-zone');
        const myIdDisplay = document.getElementById('my-id-display');
        const viewerInputZone = document.getElementById('viewer-input-zone');
        const manualPlayBtn = document.getElementById('manual-play-btn');

        function showError(title, message) {
            errorDisplay.classList.remove('hidden');
            errorDisplay.innerHTML += `<strong>[${title}]</strong> ${message}<br>`;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock inaktiv");
            }
        }

        function createPeerInstance(id = null) {
            const finalId = id || 'stream-' + Math.floor(Math.random() * 900000 + 100000);
            
            const p = new Peer(finalId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.relay.metered.ca:80' },
                        { urls: 'stun:stun.l.google.com:19302' },
                        {
                            urls: 'turn:global.relay.metered.ca:80',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443?transport=tcp',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        }
                    ],
                    iceCandidatePoolSize: 10
                }
            });

            p.on('disconnected', () => {
                statusText.innerText = "Verbindung getrennt. Reconnecte...";
                p.reconnect();
            });

            p.on('error', (err) => {
                showError("Netzwerk (" + err.type + ")", err.message);
                if (err.type === 'peer-unavailable') {
                    statusText.innerText = "Kamera-ID nicht online.";
                }
            });

            clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(() => {
                if (p && !p.destroyed && p.socket && p.socket._open) {
                    p.socket.send({ type: 'HEARTBEAT' });
                }
            }, 15000);

            return p;
        }

        // --- 1. SENDER (HANDY) ---
        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";

            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }, 
                audio: false 
            })
            .then((stream) => {
                localStream = stream;
                videoElement.srcObject = stream;
                videoElement.muted = true;
                videoElement.play().catch(() => {});

                statusText.innerText = "Verbinde mit Signal-Server...";

                requestWakeLock();
                peer = createPeerInstance();

                peer.on('open', (id) => {
                    statusText.innerText = "Kamera bereit. Warte auf Zuschauer...";
                    shareZone.classList.remove('hidden');
                    myIdDisplay.innerText = id;
                });

                // Handshake vom Zuschauer empfangen -> Call mit Video starten
                peer.on('connection', (conn) => {
                    statusText.innerText = "Zuschauer verbunden! Sende Videostream...";
                    peer.call(conn.peer, localStream);
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                });
            })
            .catch((err) => {
                showError("Kamera-Fehler", err.message);
            });
        }

        // --- 2. EMPFÄNGER (PC) ---
        function startAsViewerMode() {
            roleSelection.classList.add('hidden');
            viewerInputZone.classList.remove('hidden');
            statusText.innerText = "Bitte ID eingeben";
        }

        function playStreamSafely() {
            videoElement.muted = true;
            videoElement.playsInline = true;
            
            const promise = videoElement.play();
            if (promise !== undefined) {
                promise.then(() => {
                    manualPlayBtn.classList.add('hidden');
                    statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
                }).catch((err) => {
                    // Browser verlangt Nutzerinteraktion
                    manualPlayBtn.classList.remove('hidden');
                    statusText.innerText = "Klick erforderlich: Bitte 'Video starten' drücken!";
                });
            }
        }

        function startManualPlayback() {
            videoElement.play().then(() => {
                manualPlayBtn.classList.add('hidden');
                statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
            }).catch((err) => {
                showError("Wiedergabefehler", err.message);
            });
        }

        function connectToBroadcaster() {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) {
                alert("Bitte Kamera-ID eingeben!");
                return;
            }

            viewerInputZone.classList.add('hidden');
            statusText.innerText = "Verbinde mit Server...";

            peer = createPeerInstance();

            peer.on('open', () => {
                statusText.innerText = `Suche Kamera '${targetId}'...`;

                peer.on('call', (call) => {
                    statusText.innerText = "Signal empfangen. Binde Videobild an...";
                    call.answer();

                    call.on('stream', (remoteStream) => {
                        videoElement.srcObject = remoteStream;

                        // Sobald die ersten Videodaten decodiert sind
                        videoElement.onloadedmetadata = () => {
                            playStreamSafely();
                        };

                        // Fallback falls onloadedmetadata verzögert feuert
                        setTimeout(() => {
                            if (videoElement.paused) {
                                playStreamSafely();
                            }
                        }, 800);
                    });

                    call.on('error', (err) => {
                        showError("Stream-Fehler", err.message);
                    });
                });

                // Handshake an Handy
                const conn = peer.connect(targetId, { reliable: true });

                conn.on('open', () => {
                    statusText.innerText = "Kamera kontaktiert! Stream wird aufgebaut...";
                });

                conn.on('error', (err) => {
                    showError("Verbindung", err.message);
                });
            });
        }
    </script>
</body>
</html>
