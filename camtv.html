<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Kamera Stream Pro</title>
    
    <!-- PeerJS via unpkg mit Fallback auf cdnjs -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        if (typeof Peer === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"><\/script>');
        }
    </script>

    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 20px 10px; margin: 0; }
        video { width: 100%; max-width: 500px; background: #000; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; width: 85%; max-width: 300px; font-weight: bold; }
        .error-box { background: #551a1a; border: 1px solid #ff4d4d; color: #ffcccc; padding: 12px; margin: 20px auto; max-width: 500px; border-radius: 5px; text-align: left; font-family: monospace; }
        .info-box { background: #1e3a5f; border: 1px solid #3b82f6; color: #dbeafe; padding: 15px; margin: 20px auto; max-width: 500px; border-radius: 5px; text-align: center; word-break: break-all; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>WLAN Kamera-Streaming</h1>
    
    <div id="error-display" class="error-box hidden"></div>
    <h2 id="status">Bereit</h2>

    <div id="role-selection">
        <p>Wählen Sie aus, was dieses Gerät tun soll:</p>
        <button onclick="startAsBroadcaster()">1. Als Kamera senden</button>
        <button onclick="startAsViewerMode()">2. Als Zuschauer empfangen</button>
    </div>

    <div id="viewer-input-zone" class="hidden">
        <div class="info-box">
            <p>Geben Sie die ID des Kamera-Handys ein:</p>
            <input type="text" id="target-peer-id" placeholder="z. B. stream-123456" style="padding: 10px; width: 70%; font-size: 16px; border-radius: 4px; border: none; margin-bottom: 10px;"><br>
            <button onclick="connectToBroadcaster()" style="padding: 10px 20px; font-size: 14px;">Verbindung herstellen</button>
        </div>
    </div>

    <div id="share-zone" class="info-box hidden">
        <strong>Deine Kamera-ID:</strong> <span id="my-id-display" style="font-size: 20px; color: #60a5fa;">...generiere...</span>
        <p style="font-size: 12px; margin-top: 5px;">Tippen Sie diese ID auf dem Zuschauer-Gerät ein.</p>
    </div>

    <video id="video-element" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let localStream = null;
        
        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const roleSelection = document.getElementById('role-selection');
        const errorDisplay = document.getElementById('error-display');
        const shareZone = document.getElementById('share-zone');
        const myIdDisplay = document.getElementById('my-id-display');
        const viewerInputZone = document.getElementById('viewer-input-zone');

        function showError(title, message) {
            errorDisplay.classList.remove('hidden');
            errorDisplay.innerHTML += `<strong>[${title}]</strong> ${message}<br>`;
        }

        // Sofortprüfung beim Laden der Seite
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof Peer === 'undefined') {
                showError("Netzwerk", "PeerJS-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung und Werbeblocker prüfen.");
            }
        });

        function initPeer(customId = null) {
            if (typeof Peer === 'undefined') {
                showError("Abbruch", "PeerJS ist nicht verfügbar.");
                return false;
            }

            if (peer) {
                peer.destroy();
            }

            try {
                const finalId = customId || 'stream-' + Math.floor(Math.random() * 900000 + 100000);
                peer = new Peer(finalId);
                
                peer.on('error', (err) => {
                    showError("Netzwerk-Fehler (" + err.type + ")", err.message);
                    statusText.innerText = "Fehler aufgetreten.";
                });

                return true;
            } catch(e) {
                showError("Peer-Init", e.message);
                peer = null;
                return false;
            }
        }

        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("Sicherheit", "Kamerazugriff erfordert HTTPS oder localhost.");
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then((stream) => {
                localStream = stream;
                videoElement.srcObject = stream;
                statusText.innerText = "Kamera aktiv. Starte Netzwerkdienst...";

                if (!initPeer()) {
                    statusText.innerText = "Netzwerkstart fehlgeschlagen.";
                    return;
                }

                peer.on('open', (id) => {
                    statusText.innerText = "Bereit zum Streamen!";
                    shareZone.classList.remove('hidden');
                    myIdDisplay.innerText = id;
                });

                peer.on('connection', (conn) => {
                    const startCall = () => {
                        statusText.innerText = "Zuschauer verbunden!";
                        peer.call(conn.peer, localStream);
                    };

                    if (conn.open) {
                        startCall();
                    } else {
                        conn.on('open', startCall);
                    }
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                    statusText.innerText = "Zuschauer verbunden!";
                });
            })
            .catch((err) => {
                showError("Kamera", err.message);
            });
        }

        function startAsViewerMode() {
            roleSelection.classList.add('hidden');
            viewerInputZone.classList.remove('hidden');
            statusText.innerText = "Bereit für ID-Eingabe";
        }

        function connectToBroadcaster() {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) {
                alert("Bitte geben Sie die ID des Kamera-Handys ein!");
                return;
            }

            viewerInputZone.classList.add('hidden');
            statusText.innerText = "Verbinde mit Server...";
            
            if (!initPeer()) {
                statusText.innerText = "Verbindungsaufbau abgebrochen.";
                return;
            }

            peer.on('open', () => {
                statusText.innerText = `Rufe Kamera '${targetId}' auf...`;

                peer.on('call', (call) => {
                    call.answer();
                    call.on('stream', (remoteStream) => {
                        statusText.innerText = "Live-Stream läuft!";
                        videoElement.srcObject = remoteStream;
                    });
                    call.on('error', (err) => {
                        showError("Stream", err.message);
                    });
                });

                const conn = peer.connect(targetId);
                conn.on('open', () => {
                    statusText.innerText = "Kamera kontaktiert! Warte auf Video...";
                });
                conn.on('error', (err) => {
                    showError("Verbindung", "Kamera-ID nicht gefunden: " + err.message);
                });
            });
        }
    </script>
</body>
</html>
