<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Video Stream</title>
    <!-- PeerJS Bibliothek laden -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding: 200px 10px 10px; }
        video { width: 100%; max-width: 500px; background: #000; border-radius: 8px; margin-top: 10px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        .hidden { display: none; }
        #role-selection { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    </style>
</head>
<body>

    <!-- Rollenauswahl beim Start -->
    <div id="role-selection">
        <h2>Wählen Sie Ihre Rolle:</h2>
        <button onclick="startAsBroadcaster()">Kamera starten (Sender)</button>
        <button onclick="startAsViewer()">Stream anschauen (Empfänger)</button>
    </div>

    <!-- Hauptbereich -->
    <h2 id="status">Verbinde...</h2>
    <video id="video-element" autoplay playsinline muted></video>

    <script>
        // Eine feste ID für den Sender, damit die Zuschauer wissen, wohin sie sich verbinden müssen
        const STREAM_ID = 'mein-wlan-kamera-stream-xyz'; 
        let peer;
        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const roleSelection = document.getElementById('role-selection');

        // FUSSNOTE: Initialisiert PeerJS mit den kostenlosen Cloud-Servern für den Verbindungsaufbau
        function initPeer(id = null) {
            peer = id ? new Peer(id) : new Peer();
            
            peer.on('error', (err) => {
                console.error(err);
                statusText.innerText = "Fehler: " + err.type;
            });
        }

        // --- ROLLE 1: SENDER (KAMERA) ---
        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";
            initPeer(STREAM_ID);

            // 1. Kamera-Zugriff anfordern (Rückkamera bevorzugt)
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream; // Eigenes Bild lokal anzeigen
                statusText.innerText = "Stream läuft! Andere Handys können sich jetzt verbinden.";

                // 2. Warten, bis sich Zuschauer (Anrufer) verbinden
                peer.on('call', (call) => {
                    // Den Anruf beantworten und UNSEREN Kamera-Stream mitsenden
                    call.answer(stream);
                    console.log("Zuschauer verbunden!");
                });
            })
            .catch((err) => {
                statusText.innerText = "Kamerazugriff verweigert oder nicht unterstützt.";
                console.error(err);
            });
        }

        // --- ROLLE 2: EMPFÄNGER (ZUSCHAUER) ---
        function startAsViewer() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Verbinde zum Kamera-Handy...";
            initPeer(); // Erstellt eine zufällige ID für den Zuschauer

            peer.on('open', () => {
                // Das Kamera-Handy "anrufen". Wir senden keinen eigenen Stream (null)
                const call = peer.call(STREAM_ID, null);
                
                // Sobald wir den Video-Stream vom Kamera-Handy empfangen
                call.on('stream', (remoteStream) => {
                    statusText.innerText = "Live-Übertragung";
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false; // Ton einschalten falls gewünscht
                });
            });
        }
    </script>
</body>
</html>
