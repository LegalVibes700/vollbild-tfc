<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN & Mobilfunk Kamera Stream</title>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #ffffff; 
            padding: 20px 10px; 
            margin: 0; 
        }
        video { 
            width: 100%; 
            max-width: 540px; 
            background: #000; 
            border-radius: 8px; 
            margin-top: 15px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 8px; 
            width: 85%; 
            max-width: 320px; 
            font-weight: 600; 
        }
        button:hover { background: #0056b3; }
        input[type="text"] {
            padding: 12px;
            width: 80%;
            max-width: 300px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }
        .error-box { 
            background: #4a1515; 
            border: 1px solid #ff4d4d; 
            color: #ffcccc; 
            padding: 12px; 
            margin: 15px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: left; 
            font-family: monospace; 
            font-size: 13px;
        }
        .info-box { 
            background: #172a45; 
            border: 1px solid #2563eb; 
            color: #dbeafe; 
            padding: 16px; 
            margin: 15px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: center; 
            word-break: break-all; 
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Kamera Live-Stream</h1>
    
    <div id="error-display" class="error-box hidden"></div>
    <h2 id="status">Bereit</h2>

    <div id="role-selection">
        <p>Wählen Sie den Modus für dieses Gerät:</p>
        <button onclick="startAsBroadcaster()">1. Als Kamera senden</button>
        <button onclick="startAsViewerMode()">2. Als Zuschauer empfangen</button>
    </div>

    <div id="viewer-input-zone" class="hidden">
        <div class="info-box">
            <p>Geben Sie die ID des Kamera-Geräts ein:</p>
            <input type="text" id="target-peer-id" placeholder="z. B. stream-123456"><br>
            <button onclick="connectToBroadcaster()">Verbindung herstellen</button>
        </div>
    </div>

    <div id="share-zone" class="info-box hidden">
        <strong>Deine Kamera-ID:</strong><br>
        <span id="my-id-display" style="font-size: 24px; color: #60a5fa; font-family: monospace; font-weight: bold;">...generiere...</span>
        <p style="font-size: 12px; margin-top: 8px; color: #93c5fd;">Lassen Sie dieses Fenster geöffnet und das Display an.</p>
    </div>

    <video id="video-element" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let localStream = null;
        let heartbeatTimer = null;
        let wakeLock = null;

        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const roleSelection = document.getElementById('role-selection');
        const errorDisplay = document.getElementById('error-display');
        const shareZone = document.getElementById('share-zone');
        const myIdDisplay = document.getElementById('my-id-display');
        const viewerInputZone = document.getElementById('viewer-input-zone');

        function showError(title, message) {
            errorDisplay.classList.remove('hidden');
            errorDisplay.innerHTML += `<strong>[${title}]</strong> ${message}<br>`;
        }

        // Verhindert das Abschalten des Handy-Displays (Sender)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock nicht unterstützt oder verweigert");
            }
        }

        function createPeerInstance(id = null) {
            const finalId = id || 'stream-' + Math.floor(Math.random() * 900000 + 100000);
            
            const p = new Peer(finalId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.relay.metered.ca:80' },
                        { urls: 'stun:stun.l.google.com:19302' },
                        {
                            urls: 'turn:global.relay.metered.ca:80',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443?transport=tcp',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        }
                    ],
                    iceCandidatePoolSize: 10
                }
            });

            // Auto-Reconnect, falls PeerJS die Serververbindung trennt
            p.on('disconnected', () => {
                statusText.innerText = "Verbindung unterbrochen. Reconnecte...";
                p.reconnect();
            });

            p.on('error', (err) => {
                showError("Netzwerk (" + err.type + ")", err.message);
                if (err.type === 'peer-unavailable') {
                    statusText.innerText = "Kamera-ID nicht online. Kamera aktiv?";
                }
            });

            // Keepalive-Ping alle 15 Sekunden
            clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(() => {
                if (p && !p.destroyed && p.socket && p.socket._open) {
                    p.socket.send({ type: 'HEARTBEAT' });
                }
            }, 15000);

            return p;
        }

        // --- 1. SENDER (KAMERA) ---
        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then((stream) => {
                localStream = stream;
                videoElement.srcObject = stream;
                statusText.innerText = "Verbinde mit Signal-Server...";

                requestWakeLock();
                peer = createPeerInstance();

                peer.on('open', (id) => {
                    statusText.innerText = "Kamera bereit. Warte auf Zuschauer...";
                    shareZone.classList.remove('hidden');
                    myIdDisplay.innerText = id;
                });

                // Ruft an, sobald sich ein Zuschauer per Datenkanal meldet
                peer.on('connection', (conn) => {
                    statusText.innerText = "Zuschauer gefunden! Starte Übertragung...";
                    const call = peer.call(conn.peer, localStream);
                    
                    conn.on('close', () => {
                        statusText.innerText = "Zuschauer getrennt. Bereit für Neuverbindung.";
                    });
                });

                // Fallback für Direktaufrufe
                peer.on('call', (call) => {
                    call.answer(localStream);
                    statusText.innerText = "Live-Bild wird übertragen!";
                });
            })
            .catch((err) => {
                showError("Kamera-Fehler", err.message);
            });
        }

        // --- 2. EMPFÄNGER (ZUSCHAUER) ---
        function startAsViewerMode() {
            roleSelection.classList.add('hidden');
            viewerInputZone.classList.remove('hidden');
            statusText.innerText = "Bitte ID eingeben";
        }

        function connectToBroadcaster() {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) {
                alert("Bitte Kamera-ID eingeben!");
                return;
            }

            viewerInputZone.classList.add('hidden');
            statusText.innerText = "Verbinde mit Server...";

            peer = createPeerInstance();

            peer.on('open', () => {
                statusText.innerText = `Suche Kamera '${targetId}'...`;

                // Eingehenden Stream empfangen
                peer.on('call', (call) => {
                    statusText.innerText = "Signal empfangen. Lade Stream...";
                    call.answer();

                    call.on('stream', (remoteStream) => {
                        statusText.innerText = "Live-Stream aktiv!";
                        videoElement.srcObject = remoteStream;
                        videoElement.play().catch(() => {});
                    });

                    call.on('error', (err) => {
                        showError("Stream-Fehler", err.message);
                    });
                });

                // Signal an die Kamera schicken
                const conn = peer.connect(targetId, { reliable: true });

                const timeout = setTimeout(() => {
                    if (statusText.innerText.includes("Suche Kamera")) {
                        showError("Timeout", "Kamera antwortet nicht. Ist das Kamera-Handy aktiv und die ID exakt getippt?");
                    }
                }, 12000);

                conn.on('open', () => {
                    clearTimeout(timeout);
                    statusText.innerText = "Kamera kontaktiert! Stream startet gleich...";
                });

                conn.on('error', (err) => {
                    clearTimeout(timeout);
                    showError("Verbindung", err.message);
                });
            });
        }
    </script>
</body>
</html>
