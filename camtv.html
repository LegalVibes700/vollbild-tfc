<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN & Mobilfunk Kamera Stream</title>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #ffffff; 
            padding: 15px 10px; 
            margin: 0; 
        }
        .build-badge {
            display: inline-block;
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        video { 
            width: 100%; 
            max-width: 640px; 
            min-height: 240px;
            aspect-ratio: 16 / 9;
            background: #000; 
            border: 2px solid #333;
            border-radius: 8px; 
            margin-top: 10px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            object-fit: contain;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 8px; 
            width: 85%; 
            max-width: 320px; 
            font-weight: 600; 
        }
        button:hover { background: #0056b3; }
        .play-btn {
            background: #10b981;
            font-size: 17px;
        }
        .play-btn:hover { background: #059669; }
        input[type="text"] {
            padding: 12px;
            width: 80%;
            max-width: 300px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }
        .error-box { 
            background: #4a1515; 
            border: 1px solid #ff4d4d; 
            color: #ffcccc; 
            padding: 10px; 
            margin: 10px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: left; 
            font-family: monospace; 
            font-size: 12px;
        }
        .info-box { 
            background: #172a45; 
            border: 1px solid #2563eb; 
            color: #dbeafe; 
            padding: 14px; 
            margin: 10px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: center; 
            word-break: break-all; 
        }
        .diagnostics {
            font-family: monospace;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="build-badge">Build: 22.10.2026, 12:18 Uhr (v1.5-direct)</div>
    <h1>Kamera Live-Stream</h1>
    
    <div id="error-display" class="error-box hidden"></div>
    <h2 id="status" style="margin: 10px 0;">Bereit</h2>
    <div id="diagnostics-display" class="diagnostics">ICE: inaktiv | State: inaktiv</div>

    <div id="role-selection">
        <p>Wählen Sie den Modus für dieses Gerät:</p>
        <button onclick="startAsBroadcaster()">1. Als Kamera senden</button>
        <button onclick="startAsViewerMode()">2. Als Zuschauer empfangen</button>
    </div>

    <div id="viewer-input-zone" class="hidden">
        <div class="info-box">
            <p>Geben Sie die ID des Kamera-Geräts ein:</p>
            <input type="text" id="target-peer-id" placeholder="z. B. stream-123456"><br>
            <button onclick="connectToBroadcaster()">Verbindung herstellen</button>
        </div>
    </div>

    <div id="share-zone" class="info-box hidden">
        <strong>Deine Kamera-ID:</strong><br>
        <span id="my-id-display" style="font-size: 24px; color: #60a5fa; font-family: monospace; font-weight: bold;">...generiere...</span>
        <p style="font-size: 12px; margin-top: 8px; color: #93c5fd;">Fenster geöffnet und Display aktiv lassen.</p>
    </div>

    <button id="manual-play-btn" class="play-btn hidden" onclick="startManualPlayback()">▶ Video abspielen</button>

    <video id="video-element" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let localStream = null;
        let heartbeatTimer = null;
        let wakeLock = null;

        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const diagText = document.getElementById('diagnostics-display');
        const roleSelection = document.getElementById('role-selection');
        const errorDisplay = document.getElementById('error-display');
        const shareZone = document.getElementById('share-zone');
        const myIdDisplay = document.getElementById('my-id-display');
        const viewerInputZone = document.getElementById('viewer-input-zone');
        const manualPlayBtn = document.getElementById('manual-play-btn');

        function showError(title, message) {
            errorDisplay.classList.remove('hidden');
            errorDisplay.innerHTML += `<strong>[${title}]</strong> ${message}<br>`;
        }

        function setDiagnostics(iceState, connState) {
            diagText.innerText = `ICE: ${iceState || '-'} | State: ${connState || '-'}`;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock nicht aktiv");
            }
        }

        // Erzeugt einen 16x16 Hilfs-Videotrack, damit der Zuschauer WebRTC-konform anrufen kann
        function createDummyStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, 16, 16);
            return canvas.captureStream(1);
        }

        function createPeerInstance(id = null) {
            const finalId = id || 'stream-' + Math.floor(Math.random() * 900000 + 100000);
            
            const p = new Peer(finalId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        {
                            urls: 'turn:global.relay.metered.ca:80',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:global.relay.metered.ca:443?transport=tcp',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        }
                    ]
                }
            });

            p.on('disconnected', () => {
                statusText.innerText = "Verbindung unterbrochen. Reconnecte...";
                p.reconnect();
            });

            p.on('error', (err) => {
                showError("Netzwerk (" + err.type + ")", err.message);
                if (err.type === 'peer-unavailable') {
                    statusText.innerText = "Kamera-ID nicht online. Stimmt die ID?";
                }
            });

            clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(() => {
                if (p && !p.destroyed && p.socket && p.socket._open) {
                    p.socket.send({ type: 'HEARTBEAT' });
                }
            }, 15000);

            return p;
        }

        function attachDiagnostics(pc) {
            if (!pc) return;
            pc.oniceconnectionstatechange = () => {
                setDiagnostics(pc.iceConnectionState, pc.connectionState);
            };
            pc.onconnectionstatechange = () => {
                setDiagnostics(pc.iceConnectionState, pc.connectionState);
            };
            setDiagnostics(pc.iceConnectionState, pc.connectionState);
        }

        // --- 1. SENDER (HANDY / KAMERA) ---
        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then((stream) => {
                localStream = stream;
                videoElement.srcObject = stream;
                videoElement.muted = true;
                videoElement.play().catch(() => {});

                statusText.innerText = "Verbinde mit Signal-Server...";
                requestWakeLock();
                peer = createPeerInstance();

                peer.on('open', (id) => {
                    statusText.innerText = "Kamera bereit. Warte auf Zuschauer...";
                    shareZone.classList.remove('hidden');
                    myIdDisplay.innerText = id;
                });

                // Zuschauer ruft direkt an -> Sofort mit Videostream antworten
                peer.on('call', (call) => {
                    statusText.innerText = "Zuschauer empfangen. Sende Videobild...";
                    attachDiagnostics(call.peerConnection);
                    call.answer(localStream);
                });
            })
            .catch((err) => {
                showError("Kamera-Fehler", err.message);
            });
        }

        // --- 2. EMPFÄNGER (PC / ZUSCHAUER) ---
        function startAsViewerMode() {
            roleSelection.classList.add('hidden');
            viewerInputZone.classList.remove('hidden');
            statusText.innerText = "Bitte ID eingeben";
        }

        function triggerPlayback() {
            videoElement.muted = true;
            videoElement.playsInline = true;
            
            videoElement.play()
                .then(() => {
                    manualPlayBtn.classList.add('hidden');
                    statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
                })
                .catch(() => {
                    manualPlayBtn.classList.remove('hidden');
                    statusText.innerText = "Autoplay blockiert: Bitte 'Video abspielen' klicken!";
                });
        }

        function startManualPlayback() {
            videoElement.play().then(() => {
                manualPlayBtn.classList.add('hidden');
                statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
            }).catch(e => showError("Play", e.message));
        }

        function connectToBroadcaster() {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) {
                alert("Bitte Kamera-ID eingeben!");
                return;
            }

            viewerInputZone.classList.add('hidden');
            statusText.innerText = "Initialisiere Netzwerk...";

            peer = createPeerInstance();

            peer.on('open', () => {
                statusText.innerText = `Rufe Kamera '${targetId}' an...`;
                
                // Direkter Anruf mit Dummy-Stream (verhindert Glare und Inactive-Bugs)
                const dummyStream = createDummyStream();
                const call = peer.call(targetId, dummyStream);

                if (!call) {
                    showError("Call-Fehler", "Verbindung konnte nicht initialisiert werden.");
                    return;
                }

                attachDiagnostics(call.peerConnection);

                call.on('stream', (remoteStream) => {
                    statusText.innerText = "Video-Daten empfangen. Starte Renderer...";
                    videoElement.srcObject = remoteStream;

                    // Unmute-Listener fängt den ersten echten Frame ab
                    const videoTrack = remoteStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.onunmute = () => {
                            triggerPlayback();
                        };
                    }

                    videoElement.onloadedmetadata = () => {
                        triggerPlayback();
                    };

                    setTimeout(triggerPlayback, 1000);
                });

                call.on('error', (err) => {
                    showError("Call-Fehler", err.message);
                });
            });
        }
    </script>
</body>
</html>
