<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Live-Stream</title>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #ffffff; 
            padding: 15px 10px; 
            margin: 0; 
        }
        .build-badge {
            display: inline-block;
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        video { 
            width: 100%; 
            max-width: 640px; 
            min-height: 240px;
            aspect-ratio: 16 / 9;
            background: #000; 
            border: 2px solid #333;
            border-radius: 8px; 
            margin-top: 10px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            object-fit: contain;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 8px; 
            width: 85%; 
            max-width: 320px; 
            font-weight: 600; 
        }
        button:hover { background: #0056b3; }
        .play-btn {
            background: #10b981;
            font-size: 17px;
        }
        .play-btn:hover { background: #059669; }
        input[type="tel"] {
            padding: 12px;
            width: 75%;
            max-width: 260px;
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #60a5fa;
            margin-bottom: 12px;
            text-align: center;
            font-family: monospace;
        }
        .error-box { 
            background: #4a1515; 
            border: 1px solid #ff4d4d; 
            color: #ffcccc; 
            padding: 10px; 
            margin: 10px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: left; 
            font-family: monospace; 
            font-size: 12px;
        }
        .info-box { 
            background: #172a45; 
            border: 1px solid #2563eb; 
            color: #dbeafe; 
            padding: 16px; 
            margin: 10px auto; 
            max-width: 500px; 
            border-radius: 6px; 
            text-align: center; 
        }
        .diagnostics {
            font-family: monospace;
            font-size: 12px;
            color: #93c5fd;
            margin-top: 6px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="build-badge">Build: 22.10.2026, 12:47 Uhr (v1.7-pin-handshake)</div>
    <h1>Kamera Live-Stream</h1>
    
    <div id="error-display" class="error-box hidden"></div>
    <h2 id="status" style="margin: 10px 0;">Bereit</h2>
    <div id="diagnostics-display" class="diagnostics">ICE: inaktiv | State: inaktiv</div>

    <div id="role-selection">
        <p>Wählen Sie den Modus für dieses Gerät:</p>
        <button onclick="startAsBroadcaster()">1. Als Kamera senden</button>
        <button onclick="startAsViewerMode()">2. Als Zuschauer empfangen</button>
    </div>

    <!-- ZUSCHAUER: NUR ZAHL EINGEBEN + RETURN-TASTE -->
    <div id="viewer-input-zone" class="hidden">
        <div class="info-box">
            <p style="margin-top: 0;">Geben Sie die 6-stellige Kamera-Zahl ein:</p>
            <input type="tel" id="target-pin" placeholder="123456" maxlength="6" 
                   onkeydown="if(event.key === 'Enter') connectToBroadcaster()" autofocus><br>
            <button onclick="connectToBroadcaster()">Verbinden (oder Enter)</button>
        </div>
    </div>

    <!-- SENDER: ZEIGT DIE 6-STELLIGE PIN AN -->
    <div id="share-zone" class="info-box hidden">
        <strong>Deine Kamera-Zahl:</strong><br>
        <span id="my-pin-display" style="font-size: 32px; color: #60a5fa; font-family: monospace; font-weight: bold; letter-spacing: 3px;">...</span>
        <p style="font-size: 13px; margin: 8px 0 0 0; color: #93c5fd;">Tippen Sie nur diese Zahl auf dem Zuschauer-Gerät ein.</p>
    </div>

    <button id="manual-play-btn" class="play-btn hidden" onclick="startManualPlayback()">▶ Video abspielen</button>

    <video id="video-element" autoplay playsinline muted></video>

    <script>
        let peer = null;
        let localStream = null;
        let wakeLock = null;

        const videoElement = document.getElementById('video-element');
        const statusText = document.getElementById('status');
        const diagText = document.getElementById('diagnostics-display');
        const roleSelection = document.getElementById('role-selection');
        const errorDisplay = document.getElementById('error-display');
        const shareZone = document.getElementById('share-zone');
        const myPinDisplay = document.getElementById('my-pin-display');
        const viewerInputZone = document.getElementById('viewer-input-zone');
        const manualPlayBtn = document.getElementById('manual-play-btn');

        function showError(title, message) {
            errorDisplay.classList.remove('hidden');
            errorDisplay.innerHTML += `<strong>[${title}]</strong> ${message}<br>`;
        }

        function setDiagnostics(iceState, connState) {
            diagText.innerText = `ICE: ${iceState || '-'} | State: ${connState || '-'}`;
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        // ICE-Konfiguration: STUN + Metered TURN + OpenRelay Fallback
        function createPeerInstance(peerId) {
            const p = new Peer(peerId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:relay.metered.ca:80' },
                        
                        // Metered Cluster 1 (UDP & TCP)
                        {
                            urls: 'turn:relay.metered.ca:80',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:relay.metered.ca:443',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:relay.metered.ca:443?transport=tcp',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        // Metered Cluster 2 (Standard)
                        {
                            urls: 'turn:standard.relay.metered.ca:80',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        {
                            urls: 'turn:standard.relay.metered.ca:443?transport=tcp',
                            username: 'c2654b8cb04aab3be68260cf',
                            credential: 'tAEDEsB6ODAINzJ5'
                        },
                        // Ausfallsicheres OpenRelay
                        {
                            urls: 'turn:openrelay.metered.ca:80',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        },
                        {
                            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        }
                    ],
                    iceCandidatePoolSize: 10
                }
            });

            p.on('disconnected', () => {
                statusText.innerText = "Signal getrennt. Reconnecte...";
                p.reconnect();
            });

            p.on('error', (err) => {
                showError("Netzwerk", `${err.type}: ${err.message}`);
                if (err.type === 'peer-unavailable') {
                    statusText.innerText = "Kamera-Zahl nicht online. Läuft die Kamera?";
                }
            });

            return p;
        }

        function monitorConnection(pc, role) {
            if (!pc) return;
            const update = () => {
                setDiagnostics(pc.iceConnectionState, pc.connectionState);
                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    statusText.innerText = role === 'broadcaster' 
                        ? "Zuschauer verbunden! Übertragung läuft." 
                        : "Verbindung stabil! Live-Bild aktiv.";
                } else if (pc.iceConnectionState === 'failed') {
                    statusText.innerText = "ICE fehlgeschlagen. Versuche Neuverbindung...";
                }
            };
            pc.oniceconnectionstatechange = update;
            pc.onconnectionstatechange = update;
            update();
        }

        // --- 1. SENDER (HANDY / KAMERA) ---
        function startAsBroadcaster() {
            roleSelection.classList.add('hidden');
            statusText.innerText = "Kamera wird gestartet...";

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then((stream) => {
                localStream = stream;
                videoElement.srcObject = stream;
                videoElement.muted = true;
                videoElement.play().catch(() => {});

                statusText.innerText = "Verbinde mit Vermittlungsserver...";
                requestWakeLock();

                // 6-stellige Zahl generieren
                const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                peer = createPeerInstance('cam-' + randomPin);

                peer.on('open', () => {
                    statusText.innerText = "Kamera bereit. Warte auf Zuschauer...";
                    shareZone.classList.remove('hidden');
                    myPinDisplay.innerText = randomPin;
                });

                // Zuschauer meldet sich an -> Kamera ruft Zuschauer direkt mit dem Videostream an
                peer.on('connection', (conn) => {
                    statusText.innerText = "Zuschauer angemeldet! Sende Videostream...";
                    
                    const call = peer.call(conn.peer, localStream);
                    if (call) {
                        const checkPC = setInterval(() => {
                            const pc = call.peerConnection || call._peerConnection;
                            if (pc) {
                                clearInterval(checkPC);
                                monitorConnection(pc, 'broadcaster');
                            }
                        }, 50);
                    }
                });
            })
            .catch((err) => {
                showError("Kamera-Fehler", err.message);
            });
        }

        // --- 2. EMPFÄNGER (PC / ZUSCHAUER) ---
        function startAsViewerMode() {
            roleSelection.classList.add('hidden');
            viewerInputZone.classList.remove('hidden');
            statusText.innerText = "Bitte Zahl eingeben";
            setTimeout(() => {
                document.getElementById('target-pin').focus();
            }, 100);
        }

        function triggerPlayback() {
            videoElement.muted = true;
            videoElement.playsInline = true;
            
            videoElement.play()
                .then(() => {
                    manualPlayBtn.classList.add('hidden');
                    statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
                })
                .catch(() => {
                    manualPlayBtn.classList.remove('hidden');
                    statusText.innerText = "Klick erforderlich: Bitte 'Video abspielen' drücken!";
                });
        }

        function startManualPlayback() {
            videoElement.play().then(() => {
                manualPlayBtn.classList.add('hidden');
                statusText.innerText = `Live-Stream läuft (${videoElement.videoWidth}x${videoElement.videoHeight})`;
            }).catch(e => showError("Play", e.message));
        }

        function connectToBroadcaster() {
            let inputPin = document.getElementById('target-pin').value.trim();
            // Bereinigung: Nur Ziffern zulassen, Präfixe wie 'cam-' tolerieren
            inputPin = inputPin.replace(/[^0-9]/g, '');

            if (inputPin.length < 4) {
                alert("Bitte die vollständige Zahl eingeben!");
                return;
            }

            const targetPeerId = 'cam-' + inputPin;

            viewerInputZone.classList.add('hidden');
            statusText.innerText = `Kontaktiere Kamera ${inputPin}...`;

            // Eigene temporäre ID für den Zuschauer
            const viewerId = 'viewer-' + Math.floor(100000 + Math.random() * 900000);
            peer = createPeerInstance(viewerId);

            peer.on('open', () => {
                // Auf den eingehenden Videoanruf der Kamera warten
                peer.on('call', (call) => {
                    statusText.innerText = "Kamera sendet Stream. Verbinde...";
                    call.answer(); // Ohne eigenen Stream antworten

                    const checkPC = setInterval(() => {
                        const pc = call.peerConnection || call._peerConnection;
                        if (pc) {
                            clearInterval(checkPC);
                            monitorConnection(pc, 'viewer');
                        }
                    }, 50);

                    call.on('stream', (remoteStream) => {
                        statusText.innerText = "Videodaten empfangen! Starte Renderer...";
                        videoElement.srcObject = remoteStream;

                        const track = remoteStream.getVideoTracks()[0];
                        if (track) {
                            track.onunmute = triggerPlayback;
                        }

                        videoElement.onloadedmetadata = triggerPlayback;
                        setTimeout(triggerPlayback, 800);
                    });

                    call.on('error', (err) => {
                        showError("Call-Fehler", err.message);
                    });
                });

                // Handshake an Kamera senden: "Ich bin da, bitte sende mir das Video"
                const conn = peer.connect(targetPeerId, { reliable: true });

                conn.on('open', () => {
                    statusText.innerText = "Kamera erreicht! Warte auf Videostart...";
                });

                conn.on('error', (err) => {
                    showError("Verbindung", err.message);
                });
            });
        }
    </script>
</body>
</html>
